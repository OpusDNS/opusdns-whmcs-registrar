name: Build Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Copy the module
        run: |
          mkdir -p release
          cp -r modules release/

      - name: Write the release version into the module
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "${RELEASE_TAG#v}" > release/modules/registrars/opusdns/VERSION

      - name: Create release zip
        run: |
          cd release
          zip -r ../opusdns-whmcs.zip modules/

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./opusdns-whmcs.zip
          asset_name: opusdns-whmcs.zip
          asset_content_type: application/zip
